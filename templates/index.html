<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoundCloud Downloader</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>SoundCloud Downloader</h1>

    <form id="download-form">

        <input
            type="url"
            name="url"
            placeholder="Paste SoundCloud URL"
            required
        >

        <button type="submit">Download</button>

    </form>
	<div id="downloads"></div>

	<script>
	const form = document.getElementById("download-form");
	const downloads = document.getElementById("downloads");

	form.addEventListener("submit", async (event) => {
		event.preventDefault();

		const url = form.elements.url.value;

		const response = await fetch("/download", {
			method: "POST",
			body: new URLSearchParams({ url })
		});

		const result = await response.json();

		const item = document.createElement("div");
		item.textContent = "Queued...";

		downloads.appendChild(item);

		form.elements.url.value = "";

		pollDownload(result.job_id, item);
	});


	async function pollDownload(jobId, element) {

		const response = await fetch(`/download/${jobId}`);
		const job = await response.json();

		if (job.status === "queued") {
			element.textContent = "Queued...";
		}

		else if (job.status === "downloading") {
			var str = JSON.stringify(job)
			console.log(`downloading: job: {str}`);
			element.textContent =
				`Downloading: ${job.url}`;
		}

		else if (job.status === "done") {
			element.textContent =
				`Done ✅ ${job.title}`;

			return;
		}

		else if (job.status === "error") {
			element.textContent =
				`Error: ${job.error}`;

			return;
		}

		setTimeout(() => {
			pollDownload(jobId, element);
		}, 1000);
	}
	</script>
</body>
</html>
